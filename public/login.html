<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXMY Barber Shop | Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 60px auto;
            background: linear-gradient(145deg, #1f1d18 0%, #121210 100%);
            border: 1px solid #d4af37;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        .auth-tab {
            flex: 1;
            background: none;
            border: none;
            color: #888;
            padding: 10px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }
        .auth-tab.active {
            color: #d4af37;
            border-bottom: 2px solid #d4af37;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <span class="brand-name">AXMY BARBER SHOP</span>
        </div>
    </header>

    <main class="container">
        <div class="auth-container">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="cambiarTab('login')">Iniciar Sesión</button>
                <button class="auth-tab" onclick="cambiarTab('registro')">Registrarse</button>
            </div>

            <!-- Formulario de Login -->
            <form id="formLogin">
                <h2 class="main-title" style="font-size: 1.5rem; margin-bottom: 15px;">Bienvenido de nuevo</h2>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="loginEmail" placeholder="tucorreo@email.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-confirmar-reserva" style="margin-top: 15px;">INGRESAR</button>
            </form>

            <!-- Formulario de Registro -->
            <form id="formRegistro" class="hidden">
                <h2 class="main-title" style="font-size: 1.5rem; margin-bottom: 15px;">Crear Cuenta</h2>
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="regNombre" placeholder="Tu Nombre" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="regEmail" placeholder="tucorreo@email.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="regPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-confirmar-reserva" style="margin-top: 15px;">REGISTRARSE</button>
            </form>
        </div>
    </main>

    <script>
        function cambiarTab(tipo) {
            const tabLogin = document.querySelectorAll('.auth-tab')[0];
            const tabRegistro = document.querySelectorAll('.auth-tab')[1];
            const formLogin = document.getElementById('formLogin');
            const formRegistro = document.getElementById('formRegistro');

            if (tipo === 'login') {
                tabLogin.classList.add('active');
                tabRegistro.classList.remove('active');
                formLogin.classList.remove('hidden');
                formRegistro.classList.add('hidden');
            } else {
                tabRegistro.classList.add('active');
                tabLogin.classList.remove('active');
                formRegistro.classList.remove('hidden');
                formLogin.classList.add('hidden');
            }
        }

        // Manejar Login y redirección por rol
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('rol', data.rol);

                    // Redirección inteligente según el rol
                    if (data.rol === 'admin') {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/index.html';
                    }
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Error de conexión con el servidor.');
            }
        });

        // Manejar Registro
        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('regNombre').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const res = await fetch('/api/auth/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password })
                });
                const data = await res.json();

                if (data.success) {
                    alert('¡Cuenta creada con éxito! Por favor inicia sesión.');
                    cambiarTab('login');
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Error de conexión.');
            }
        });
    </script>
</body>
</html>
